[package]
name = "cert-recon"
description = "Queries certificate transparency logs for subdomains of a domain"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.6", features = ["derive", "env"] }
futures = "=0.3.34"
sqlx = { version = "=0.9.0", features = ["runtime-tokio", "postgres", "tls-rustls"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
grimoire = { path = "../grimoire" }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["fmt", "env-filter"] }
log = "=0.4.33"
