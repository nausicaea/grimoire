[package]
name = "http-recon"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "=1.0.104"
base64ct = "=1.8.3"
clap = { version = "=4.6.6", features = ["derive", "env"] }
cookie = "=0.18.1"
futures = "=0.3.33"
grimoire = { path = "../grimoire" }
itertools = "=0.15.0"
reqwest = { version = "=0.13.4", features = ["socks"] }
reqwest-middleware = "=0.5.2"
reqwest-ratelimit = "=0.5.0"
reqwest-leaky-bucket = "=0.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sqlx = { version = "=0.9.0", features = ["runtime-tokio", "postgres"] }
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "io-std"] }
tokio-util = { version = "=0.7.19", features = ["io", "codec"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
