[package]
name = "dns-recon"
description = "Performs DNS A queries on FQNS supplied from Stdin"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.6", features = ["derive", "env"] }
futures = "=0.3.33"
grimoire = { path = "../grimoire" }
hickory-resolver = "=0.26.1"
itertools = "=0.15.0"
sqlx = { version = "=0.9.0", features = ["runtime-tokio", "postgres", "ipnetwork"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "io-std"] }
tokio-util = { version = "=0.7.19", features = ["io", "codec"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["fmt", "env-filter"] }
